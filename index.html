<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduGames: Bird, Match, Hangman & Space</title>
    <link rel="icon" type="image/png" href="imagenes/logo.png">
    <link rel="stylesheet" href="diseno.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
</head>

<body> 
    <img src="imagenes/logo.png" id="logo" alt="logo">

    <!-- MENÚ PRINCIPAL -->
    <div id="menuPrincipal" class="pantalla-menu">
            <!-- Nuevo Título Superior -->
            <h1 class="banner-titulo">ENGLISH-BIRD-ADVENTURE</h1>
            <h2 class="titulo-principal">CHOOSE YOUR GAME</h2>
            
            <div class="contenedor-tarjetas-menu">
                <div class="tarjeta-juego" onclick="iniciarJuego('bird')">
                    <img src="imagenes/birdp.png" alt="Bird Game" class="img-tarjeta">
                    <div class="overlay-tarjeta">
                        <span>BIRD</span>
                    </div>
                </div>
    
                <div class="tarjeta-juego" onclick="iniciarJuego('match')">
                    <img src="imagenes/matchp.png" alt="Match Game" class="img-tarjeta">
                    <div class="overlay-tarjeta">
                        <span>MATCH</span>
                    </div>
                </div>
    
                <div class="tarjeta-juego" onclick="iniciarJuego('hangman')">
                    <img src="imagenes/hangmanp.png" alt="Hangman Game" class="img-tarjeta">
                    <div class="overlay-tarjeta">
                        <span>HANGMAN</span>
                    </div>
                </div>
    
                <div class="tarjeta-juego" onclick="iniciarJuego('space')">
                    <img src="imagenes/spacep.png" alt="Space Game" class="img-tarjeta">
                    <div class="overlay-tarjeta">
                        <span>SPACE</span>
                    </div>
                </div>
            </div>
        </div>

    <!-- VISTA BIRD -->
    <div id="vistaBird" class="vista-juego oculto">
        <button class="btn-volver" onclick="volverAlMenu()">⬅ Menu</button>
        
        <div class="contenedor">
            <!-- Categorías a la izquierda -->
            <div id="contenedorCategorias" class="categorias-bar selector-categoria"></div>

            <div class="juego">
                <canvas id="lienzojuego"></canvas>
                <button id="btnAccionBird" class="btn-overlay" onclick="iniciarOReiniciarBird()">PLAY</button>
            </div>

            <div class="panel">
                <h2>✍ Vocabulary</h2>
                <div id="listaPalabras"></div>
                <hr>
                <h3>
                    Palabras aprendidas:
                    <span id="contador">0</span>
                </h3>
            </div>
        </div>
    </div>

    <!-- VISTA MATCH -->
    <div id="vistaMatch" class="vista-juego oculto">
        <button class="btn-volver" onclick="volverAlMenu()">⬅ Menu</button>
        <h2 class="titulo-math">🧮 Math Card Match</h2>
        
        <div class="categorias-bar selector-categoria">
            <button class="btn-categoria activa" onclick="cambiarNivelMatch('numeros', this)">🔢 Numbers</button>
            <button class="btn-categoria" onclick="cambiarNivelMatch('multiplicaciones', this)">✖️ Multiplications</button>
        </div>

        <div id="tableroCartas" class="tablero-cartas"></div>
    </div>

    <!-- VISTA HANGMAN -->
    <div id="vistaHangman" class="vista-juego oculto">
        <button class="btn-volver" onclick="volverAlMenu()">⬅ Menu</button>
        <h2 class="titulo-math">🪢 Hangman Game</h2>

        <div class="main-container-hangman">
            <h1 id="msg-final"></h1>
            <h3 id="acierto"></h3>
            
            <div class="flex-row no-wrap contenedor-ahorcado-img">
                <img id="ahorcadoImg" src="imagenes/ahorcado_6.png" alt="Ahorcado" class="img-ahorcado">
                <h2 class="palabra" id="palabra"></h2>
            </div>

            <div class="flex-row" id="turnos">
                <div class="col">
                    <h3>Intentos restantes: <span id="intentos">6</span></h3>
                </div>
                <div class="col">
                    <button onclick="inicioHangman()" id="reset" class="btn-categoria">Elegir otra palabra</button>
                    <button onclick="pista()" id="pista" class="btn-categoria">💡 Pista</button>
                </div>
            </div>
            
            <div id="hueco-pista" class="pista-container"></div>

            <div class="flex-row">
                <div class="col-100">
                    <div class="flex-row" id="abcdario"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- VISTA SPACE -->
    <div id="vistaSpace" class="vista-juego oculto">
        <button class="btn-volver" onclick="volverAlMenu()">⬅ Menu</button>
        <h2 class="titulo-math">🚀 Space Vocabulary</h2>

        <div class="main-container-space">
            <div class="juego-space-wrapper" style="position: relative; display: inline-block;">
                <canvas id="canvasSpace" width="800" height="500"></canvas>
                <button id="btnAccionSpace" class="btn-overlay" onclick="comenzarPartidaSpace()">PLAY</button>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 10px;">
            <button class="btn-categoria" onclick="comenzarPartidaSpace()">🔄 Reset Game</button>
        </div>

        <div class="controles-tactiles-space">
            <div class="grupo-direccion">
                <button class="btn-touch" id="btnIzquierda">◀</button>
                <button class="btn-touch" id="btnDerecha">▶</button>
            </div>
            <button class="btn-touch btn-disparo-touch" id="btnDisparo">🚀</button>
        </div>
    </div>

    <script src="juego.js"></script>
    <script src="juego2.js"></script>
    <script src="juego3.js"></script>
</body>
</html>
