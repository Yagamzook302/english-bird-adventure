<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Bird Adventure</title>
    <link rel="icon" type="image/png" href="imagenes/logo.png">
    <link rel="stylesheet" href="diseño.css">
    <style>
        body {
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            min-height: 100vh;
            background: linear-gradient(180deg, #001f3f, #003366, #001122);
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #logo {
            position: absolute; 
            top: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid white;
            z-index: 999;
            box-shadow: 0 0 10px #00d9ff, 0 0 20px #00d9ff;
        }

        .contenedor {
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: center;
            justify-content: center;
            max-width: 100%;
        }

        .juego {
            border: 4px solid #00d9ff;
            box-shadow: 0 0 10px #00d9ff, 0 0 25px #00d9ff, 0 0 50px #00d9ff;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
        }

        .panel {
            width: 280px;
            height: 530px;
            max-height: 80vh;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .panel h2 {
            text-align: center;
            color: #00d9ff;
            margin-top: 5px;
        }

        .panel h3 {
            color: white;
        }

        #listaPalabras {
            margin-top: 15px;
        }

        .palabra {
            padding: 8px;
            margin-bottom: 8px;
            background: #fcfeff;
            border-radius: 8px;
            color: #333;
        }

        /* Adaptación a dispositivos móviles (teléfonos y pantallas reducidas) */
        @media (max-width: 768px) {
            .contenedor {
                flex-direction: column;
                align-items: center;
            }
            
            .juego {
                width: 90vw;
                max-width: 360px;
                height: auto;
            }

            .panel {
                width: 90vw;
                max-width: 360px;
                height: 200px;
            }

            #logo {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>

<body> 
    <img src="imagenes/logo.png" id="logo" alt="logo">
    
    <div class="contenedor">
        <div class="juego">
            <canvas id="lienzojuego"></canvas>
        </div>

        <div class="panel">
            <h2>📚 Vocabulary</h2>
            <div id="listaPalabras"></div>
            <hr>
            <h3>
                Palabras aprendidas:
                <span id="contador">0</span>
            </h3>
        </div>
    </div>

    <script src="juego.js"></script>
</body>
</html>
