<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduGames: Bird & Match</title>
    <link rel="icon" type="image/png" href="imagenes/logo.png">
    <link rel="stylesheet" href="diseño.css">
</head>

<body> 
    <img src="imagenes/logo.png" id="logo" alt="logo">

    <div id="menuPrincipal" class="pantalla-menu">
        <h1 class="titulo-principal">CHOOSE YOUR GAME</h1>
        <div class="contenedor-botones-menu">
            <button id="btnJuegoBird" class="btn-menu btn-bird" onclick="iniciarJuego('bird')">BIRD</button>
            <button id="btnJuegoMatch" class="btn-menu btn-match" onclick="iniciarJuego('match')">MATCH</button>
        </div>
    </div>

    <div id="vistaBird" class="vista-juego oculto">
        <button class="btn-volver" onclick="volverAlMenu()">⬅ Menu</button>
        
        <!-- Contenedor dinámico para los 12 niveles -->
        <div id="contenedorCategorias" class="categorias-bar selector-categoria"></div>

        <div class="contenedor">
            <div class="juego">
                <canvas id="lienzojuego"></canvas>
            </div>

            <div class="panel">
                <h2>📚 Vocabulary</h2>
                <div id="listaPalabras"></div>
                <hr>
                <h3>
                    Palabras aprendidas:
                    <span id="contador">0</span>
                </h3>
            </div>
        </div>
    </div>

    <div id="vistaMatch" class="vista-juego oculto">
        <button class="btn-volver" onclick="volverAlMenu()">⬅ Menu</button>
        <h2 class="titulo-math">🧮 Math Card Match</h2>
        <div id="tableroCartas" class="tablero-cartas"></div>
    </div>

<script src="juego.js"></script>
</body>
</html>
